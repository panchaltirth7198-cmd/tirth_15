<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #4f5dcc;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔮 Prediction System</h1>

    <p>Enter your study hours:</p>

    <input type="number" id="hours" placeholder="Enter hours">

    <button onclick="predict()">Predict Result</button>

    <div id="result"></div>

</div>

<script>

function predict() {

    let hours = Number(document.getElementById("hours").value);
    let result = document.getElementById("result");

    if (hours === "" || hours < 0) {
        result.innerHTML = "Please enter valid study hours.";
        return;
    }

    if (hours >= 8) {
        result.innerHTML = "🌟 Prediction: Excellent Result!";
    }
    else if (hours >= 5) {
        result.innerHTML = "👍 Prediction: Good Result!";
    }
    else if (hours >= 3) {
        result.innerHTML = "📚 Prediction: Average Result.";
    }
    else {
        result.innerHTML = "⚠️ Prediction: Need More Study!";
    }
}

</script>

</body>
</html>
